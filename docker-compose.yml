services:
  ibarangay:
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* variables must be baked into the JS bundle at BUILD time.
      # Docker Compose reads variable substitution (${VAR}) from a file named
      # exactly ".env" at the project root, OR from the --env-file flag.
      # We use --env-file so the professor only manages one file (.env.docker).
      #
      # Run with:
      #   docker compose --env-file .env.docker up --build
      #
      args:
        NEXT_PUBLIC_FIREBASE_API_KEY:              ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:          ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID:           ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:       ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:  ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID:               ${NEXT_PUBLIC_FIREBASE_APP_ID}
        NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID:       ${NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID}

    # Server-side secrets (Admin SDK, Gemini) injected at RUNTIME only.
    # They are never baked into the image layer.
    env_file:
      - .env.docker

    ports:
      - "3000:3000"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
